<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>River Explorer — TroutAtlas</title>
  <link rel="stylesheet" href="style.css?v=19">
  <link rel="stylesheet" href="explore-style.css?v=19">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="explorer-body">

<div id="debug-banner" style="position:fixed;top:0;left:0;right:0;z-index:9999;background:#0f172a;border-bottom:2px solid #3b82f6;padding:10px 14px;font-family:system-ui,sans-serif;font-size:13px;color:#e2e8f0;box-shadow:0 4px 20px rgba(0,0,0,.5);">
  <span id="debug-status">⏳ TroutAtlas Explorer v19 — caricamento in corso…</span>
  <button onclick="location.reload(true)" style="margin-left:10px;padding:4px 10px;border-radius:6px;border:1px solid #3b82f6;background:rgba(59,130,246,.15);color:#93c5fd;cursor:pointer;font-size:12px;">🔄 Refresh forzato</button>
</div>
<script>
(function(){
  const banner = document.getElementById('debug-banner');
  const status = document.getElementById('debug-status');
  window.addEventListener('error', function(e){
    status.innerHTML = '<b>❌ ERRORE JS:</b> ' + (e.message || e.error || 'errore sconosciuto') + ' — vedi console';
    banner.style.borderColor = '#ef4444';
  });
  window.addEventListener('unhandledrejection', function(e){
    status.innerHTML = '<b>❌ ERRORE ASYNC:</b> ' + (e.reason && e.reason.message ? e.reason.message : e.reason) + ' — vedi console';
    banner.style.borderColor = '#ef4444';
  });
  document.addEventListener('DOMContentLoaded', function(){
    status.innerHTML = '<b>✅ DOM pronto</b> — in attesa dei dati…';
  });
  window.addEventListener('load', function(){
    setTimeout(function(){
      if(banner.style.borderColor !== 'rgb(239, 68, 68)') {
        banner.style.opacity = '0';
        setTimeout(function(){ banner.style.display='none'; }, 500);
      }
    }, 2000);
  });
})();
</script>

<!-- ── Top bar ─────────────────────────────────────────────── -->
<div class="ex-topbar">
  <a class="ex-back" href="index.html">←</a>
  <div class="ex-topbar-center">
    <span class="ex-topbar-icon">🗺️</span>
    <span class="ex-topbar-title">River Explorer</span>
  </div>
  <button class="ex-nearme-btn" id="near-me-btn" title="Intorno a me">📍</button>
</div>

<!-- ── Filter strip ───────────────────────────────────────── -->
<div class="ex-filter-strip" id="ex-filter-strip">
  <button class="ex-filter active" data-filter="all">Tutti</button>
  <button class="ex-filter" data-filter="region-Piemonte">🏔 Piemonte</button>
  <button class="ex-filter" data-filter="region-Valle d'Aosta">🏔 Valle d'Aosta</button>
  <button class="ex-filter" data-filter="type-fiume">🌊 Fiumi</button>
  <button class="ex-filter" data-filter="type-torrente">💧 Torrenti</button>
  <button class="ex-filter" data-filter="type-lago">🏞 Laghi</button>
</div>

<!-- ── Layer toggle strip ─────────────────────────────────── -->
<div class="ex-layers-strip" id="ex-layers-strip">
  <span class="ex-layers-label">Mappa:</span>
  <button class="ex-layer-btn active" data-layer="spots">🎣 Spot</button>
  <button class="ex-layer-btn active" data-layer="landmarks">🗺️ Luoghi</button>
  <button class="ex-layer-btn active" data-layer="localities">📍 Località</button>
  <button class="ex-layer-btn active" data-layer="parking">🅿️ Parcheggi</button>
</div>

<!-- ── Map ───────────────────────────────────────────────── -->
<div id="explorer-map"></div>

<!-- ── Bottom drawer ──────────────────────────────────────── -->
<div class="ex-drawer" id="ex-drawer">
  <div class="ex-drawer-handle" id="ex-drawer-handle">
    <div class="ex-drawer-handle-bar"></div>
  </div>

  <!-- LIST VIEW: all rivers -->
  <div id="ex-list-view">
    <div class="ex-list-header">
      <span id="ex-list-count">Caricamento…</span>
      <span class="ex-list-hint">Tocca un fiume sulla mappa o nella lista</span>
    </div>
    <div id="ex-river-list"></div>
  </div>

  <!-- DETAIL VIEW: selected river -->
  <div id="ex-detail-view" style="display:none">
    <div class="ex-detail-header">
      <button class="ex-detail-back" id="ex-detail-back">← Tutti i fiumi</button>
      <a class="ex-detail-open-btn" id="ex-open-river" href="#">📋 Scheda completa</a>
    </div>
    <div class="ex-detail-river-title">
      <h2 id="ex-detail-name"></h2>
      <p id="ex-detail-meta"></p>
    </div>

    <!-- Zone legend strip -->
    <div class="ex-zones-strip" id="ex-zones"></div>

    <!-- Locality path navigation -->
    <div class="ex-section-label" style="justify-content:space-between">
      <div style="display:flex;align-items:center;gap:6px">
        <span class="ex-section-icon">⛰️</span>
        Percorso — dalla sorgente alla confluenza
      </div>
      <button class="ex-journey-btn" id="ex-journey-btn">▶ Segui il fiume</button>
    </div>
    <div class="ex-localities-rail" id="ex-localities"></div>

    <!-- Spots for selected locality -->
    <div id="ex-locality-spots"></div>

    <!-- Permits mini-card -->
    <div id="ex-permits-mini"></div>

    <!-- Bottom padding -->
    <div style="height:24px"></div>
  </div>
</div>

<!-- ── Bottom Nav ─────────────────────────────────────────── -->
<nav class="bottom-nav">
  <a class="bnav-item" href="index.html"><span class="bnav-icon">🎣</span>Torrenti</a>
  <a class="bnav-item" href="trote.html"><span class="bnav-icon">🐟</span>Trote</a>
  <a class="bnav-item" href="knots.html"><span class="bnav-icon">🪰</span>Nodi</a>
  <a class="bnav-item" href="negozi.html"><span class="bnav-icon">🏪</span>Negozi</a>
  <a class="bnav-item bnav-item--active" href="explore.html"><span class="bnav-icon">🗺️</span>Esplora</a>
  <a class="bnav-item" href="atlas.html"><span class="bnav-icon">🤖</span>Atlas AI</a>
</nav>

<script src="explore.js?v=19"></script>
<script src="sw-register.js?v=22"></script>
</body>
</html>
