<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas AI — TroutAtlas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="atlas-body">

<div class="atlas-header-bar">
  <div class="atlas-header-inner">
    <div class="atlas-logo">
      <span class="atlas-logo-icon">🤖</span>
      <div>
        <div class="atlas-logo-title">ATLAS AI</div>
        <div class="atlas-logo-sub">Il tuo assistente intelligente per la pesca alla trota.</div>
      </div>
    </div>
    <button class="atlas-clear-btn" id="atlas-clear-btn" title="Nuova conversazione">↺</button>
  </div>
</div>

<!-- Chat messages -->
<div class="atlas-chat" id="atlas-chat">
  <div class="atlas-welcome" id="atlas-welcome">
    <div class="atlas-welcome-icon">🎣</div>
    <div class="atlas-welcome-text">
      Ciao! Sono <strong>ATLAS AI</strong>, il tuo esperto di pesca alla trota.<br>
      Posso aiutarti a scegliere dove pescare, quale tecnica usare, interpretare le condizioni e molto altro.
    </div>
    <div class="atlas-chips-label">Domande rapide</div>
    <div class="atlas-chips" id="atlas-chips">
      <button class="atlas-chip" data-q="Dove pescare oggi?">🎣 Dove pescare oggi?</button>
      <button class="atlas-chip" data-q="Quale mosca usare adesso?">🪰 Quale mosca usare?</button>
      <button class="atlas-chip" data-q="Com'è il Sesia in questo periodo?">🌊 Com'è il Sesia adesso?</button>
      <button class="atlas-chip" data-q="Trova lo spot migliore per me">📍 Trova uno spot</button>
      <button class="atlas-chip" data-q="Dove trovo le trote adesso?">🐟 Dove trovare le trote?</button>
      <button class="atlas-chip" data-q="Spiegami la pesca a ninfa">📚 Spiegami una tecnica</button>
    </div>
  </div>
</div>

<!-- Input area -->
<div class="atlas-input-bar">
  <div class="atlas-input-inner">
    <textarea
      id="atlas-input"
      class="atlas-textarea"
      placeholder="Chiedi qualsiasi cosa sulla pesca…"
      rows="1"
      maxlength="500"
    ></textarea>
    <button class="atlas-send-btn" id="atlas-send-btn">
      <span class="atlas-send-icon">↑</span>
    </button>
  </div>
</div>

<nav class="bottom-nav">
  <a class="bnav-item" href="index.html"><span class="bnav-icon">🎣</span>Torrenti</a>
  <a class="bnav-item" href="trote.html"><span class="bnav-icon">🐟</span>Trote</a>
  <a class="bnav-item" href="knots.html"><span class="bnav-icon">🪰</span>Nodi</a>
  <a class="bnav-item" href="negozi.html"><span class="bnav-icon">🏪</span>Negozi</a>
  <a class="bnav-item" href="mappa.html"><span class="bnav-icon">🗺️</span>Mappa</a>
  <a class="bnav-item active" href="atlas.html"><span class="bnav-icon">🤖</span>Atlas AI</a>
</nav>

<script src="atlas.js"></script>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
