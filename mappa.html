<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La tua mappa — TroutAtlas</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="mappa-page">

<div class="river-header">
  <a class="back-btn" href="index.html">← Tutti i torrenti</a>
  <div class="river-title" style="padding-bottom:16px">
    <h1 style="font-size:24px">🗺️ La tua mappa</h1>
    <p class="location">I posti dove hai pescato</p>
  </div>
</div>

<!-- Full map -->
<div id="user-map"></div>

<!-- Floating add button -->
<button class="fab" id="fab-add" title="Aggiungi uno spot">＋</button>

<!-- Spot count -->
<div class="spot-count" id="spot-count"></div>

<!-- Add spot modal -->
<div class="modal-overlay" id="add-modal">
  <div class="modal modal-tall">
    <div class="modal-header">
      <h3>📍 Nuovo spot di pesca</h3>
      <button class="modal-close" id="add-modal-close">✕</button>
    </div>
    <div class="modal-body">
      <p class="modal-hint" id="map-hint">Tocca la mappa per scegliere la posizione, poi compila i dettagli.</p>

      <label class="form-label">Nome dello spot *</label>
      <input class="form-input" id="spot-name" type="text" placeholder="Es. Curva del mulinello">

      <label class="form-label">Specie catturata</label>
      <input class="form-input" id="spot-species" type="text" placeholder="Es. Trota Fario 38 cm">

      <label class="form-label">Descrizione</label>
      <textarea class="form-input form-textarea" id="spot-desc" placeholder="Fondo ghiaioso, corrente moderata, profondo circa 60 cm…"></textarea>

      <label class="form-label">Foto del pescato</label>
      <label class="photo-upload" id="photo-label">
        <span id="photo-text">📷 Tocca per aggiungere una foto</span>
        <input type="file" id="spot-photo" accept="image/*" capture="environment" style="display:none">
        <img id="photo-preview" class="photo-preview-img" style="display:none">
      </label>

      <div class="coord-display" id="coord-display">📍 Posizione non selezionata</div>

      <button class="btn btn-primary" id="save-spot-btn" style="margin-top:16px">Salva spot</button>
    </div>
  </div>
</div>

<!-- Spot detail modal -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal modal-tall">
    <div class="modal-header">
      <h3 id="detail-title"></h3>
      <button class="modal-close" id="detail-close">✕</button>
    </div>
    <div class="modal-body" id="detail-body"></div>
  </div>
</div>

<script src="mappa.js"></script>
</body>
</html>
