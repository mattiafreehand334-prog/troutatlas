<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La tua mappa — TroutAtlas</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="mappa-page no-bottom-pad">

<div class="page-header">
  <div class="page-header-inner">
    <h1>🗺️ La tua mappa</h1>
    <p>I posti dove hai pescato</p>
  </div>
</div>

<div id="user-map"></div>

<button class="fab" id="fab-add" title="Aggiungi spot">＋</button>
<div class="spot-count" id="spot-count"></div>

<nav class="bottom-nav">
  <a class="bnav-item" href="index.html"><span class="bnav-icon">🎣</span>Torrenti</a>
  <a class="bnav-item" href="trote.html"><span class="bnav-icon">🐟</span>Trote</a>
  <a class="bnav-item" href="knots.html"><span class="bnav-icon">🪰</span>Nodi</a>
  <a class="bnav-item" href="negozi.html"><span class="bnav-icon">🏪</span>Negozi</a>
  <a class="bnav-item active" href="mappa.html"><span class="bnav-icon">🗺️</span>Mappa</a>
  <a class="bnav-item" href="atlas.html"><span class="bnav-icon">🤖</span>Atlas AI</a>
</nav>

<!-- Add spot modal -->
<div class="modal-overlay" id="add-modal">
  <div class="modal modal-tall">
    <div class="modal-header">
      <h3>📍 Nuovo spot di pesca</h3>
      <button class="modal-close" id="add-modal-close">✕</button>
    </div>
    <div class="modal-body">
      <p class="modal-hint" id="map-hint">Tocca la mappa per scegliere la posizione, poi compila i dettagli.</p>
      <label class="form-label">Nome dello spot *</label>
      <input class="form-input" id="spot-name" type="text" placeholder="Es. Curva del mulinello">
      <label class="form-label">Specie catturata</label>
      <input class="form-input" id="spot-species" type="text" placeholder="Es. Trota Fario 38 cm">
      <label class="form-label">Descrizione</label>
      <textarea class="form-input form-textarea" id="spot-desc" placeholder="Fondo ghiaioso, corrente moderata…"></textarea>
      <label class="form-label">Foto del pescato</label>
      <label class="photo-upload" id="photo-label">
        <span id="photo-text">📷 Tocca per aggiungere una foto</span>
        <input type="file" id="spot-photo" accept="image/*" capture="environment" style="display:none">
        <img id="photo-preview" class="photo-preview-img" style="display:none">
      </label>
      <div class="coord-display" id="coord-display">📍 Posizione non selezionata</div>
      <button class="btn btn-primary" id="save-spot-btn" style="margin-top:16px">Salva spot</button>
    </div>
  </div>
</div>

<!-- Spot detail modal -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal modal-tall">
    <div class="modal-header">
      <h3 id="detail-title"></h3>
      <button class="modal-close" id="detail-close">✕</button>
    </div>
    <div class="modal-body" id="detail-body"></div>
  </div>
</div>

<script src="mappa.js"></script>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
