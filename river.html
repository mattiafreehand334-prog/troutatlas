<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torrente — TroutAtlas</title>
  <link rel="stylesheet" href="style.css?v=19">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<div id="debug-banner" style="position:fixed;top:0;left:0;right:0;z-index:9999;background:#0f172a;border-bottom:2px solid #3b82f6;padding:10px 14px;font-family:system-ui,sans-serif;font-size:13px;color:#e2e8f0;box-shadow:0 4px 20px rgba(0,0,0,.5);">
  <span id="debug-status">⏳ TroutAtlas v19 — caricamento in corso…</span>
  <button onclick="location.reload(true)" style="margin-left:10px;padding:4px 10px;border-radius:6px;border:1px solid #3b82f6;background:rgba(59,130,246,.15);color:#93c5fd;cursor:pointer;font-size:12px;">🔄 Refresh forzato</button>
</div>
<script>
(function(){
  const banner = document.getElementById('debug-banner');
  const status = document.getElementById('debug-status');
  window.addEventListener('error', function(e){
    status.innerHTML = '<b>❌ ERRORE JS:</b> ' + (e.message || e.error || 'errore sconosciuto') + ' — vedi console';
    banner.style.borderColor = '#ef4444';
  });
  window.addEventListener('unhandledrejection', function(e){
    status.innerHTML = '<b>❌ ERRORE ASYNC:</b> ' + (e.reason && e.reason.message ? e.reason.message : e.reason) + ' — vedi console';
    banner.style.borderColor = '#ef4444';
  });
  document.addEventListener('DOMContentLoaded', function(){
    status.innerHTML = '<b>✅ DOM pronto</b> — in attesa dei dati…';
  });
  // Hide banner after successful load
  window.addEventListener('load', function(){
    setTimeout(function(){
      if(banner.style.borderColor !== 'rgb(239, 68, 68)') {
        banner.style.opacity = '0';
        setTimeout(function(){ banner.style.display='none'; }, 500);
      }
    }, 2000);
  });
})();
</script>

<div class="river-header" style="padding-top:46px;">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 8px 0">
    <a class="back-btn" href="index.html" style="padding:8px 16px;display:inline-flex;align-items:center;gap:6px;color:var(--accent);text-decoration:none;font-size:13px;font-weight:600">← Tutti i torrenti</a>
    <a href="explore.html" style="padding:8px 14px;display:inline-flex;align-items:center;gap:5px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:600;border:1px solid var(--border);border-radius:12px;background:var(--card)">🗺️ River Explorer</a>
  </div>
  <div class="gallery-wrap" id="gallery-wrap">
    <div class="gallery-track" id="gallery-track"></div>
    <button class="gallery-prev" id="gallery-prev">‹</button>
    <button class="gallery-next" id="gallery-next">›</button>
    <div class="gallery-dots" id="gallery-dots"></div>
  </div>
  <div class="river-title">
    <div class="river-title-row">
      <h1 id="river-name"></h1>
      <button class="fav-btn-detail" id="fav-btn-detail">🤍</button>
    </div>
    <p class="location" id="river-location"></p>
  </div>
</div>

<div class="detail-main">
  <div class="detail-section"><h2>🐟 Specie presenti</h2><p id="river-species"></p></div>
  <div class="detail-section"><h2>🎣 Canna consigliata</h2><p id="river-rod"></p></div>
  <div class="detail-section"><h2>🧵 Lenza consigliata</h2><p id="river-line"></p></div>
  <div class="detail-section"><h2>🪱 Artificiali consigliati</h2><div class="lures-list" id="river-lures"></div></div>
  <div class="detail-section"><h2>🥾 Difficoltà</h2><div class="difficulty" id="river-difficulty"></div></div>
  <div class="detail-section">
    <h2>📍 Posizione</h2>
    <div id="map"></div>
    <a id="gmaps-btn" class="btn btn-maps">🧭 Portami qui</a>
    <button id="reg-btn" class="btn btn-regs">📋 Regolamenti della zona</button>
  </div>
  <!-- Localities — geographic path from source to downstream -->
  <div id="localities-section"></div>
  <!-- Fishing Intelligence section (populated by intelligence.js) -->
  <div id="intel-section"></div>
  <!-- Permits & Licences -->
  <div id="permits-section"></div>
  <!-- Prepara la tua uscita -->
  <div id="trip-prep-section"></div>
</div>

<nav class="bottom-nav">
  <a class="bnav-item" href="index.html"><span class="bnav-icon">🎣</span>Torrenti</a>
